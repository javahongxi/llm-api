# llm-api proxy configuration (mirrors litellm proxy config.yaml).
# Run: go run ./cmd/llm-api --config config.example.yaml
#
# Each entry maps a public model_name (what clients send) to backend
# litellm_params. api_key supports "os.environ/VAR" to read an environment
# variable, so secrets stay out of the file.

server:
  host: 127.0.0.1
  port: 8888

# General settings (mirrors litellm general_settings). Setting a master_key
# enables virtual-key auth: data endpoints then require a proxy-issued key
# (Authorization: Bearer <key>), and the master key administers /key/* and
# /spend. Omit it to run in open mode (no auth). Supports os.environ/VAR.
general_settings:
  master_key: os.environ/LLM_API_MASTER_KEY
  # master_key: sk-my-master-key

# Router settings (mirrors litellm router_settings). Multiple model_list entries
# sharing a model_name form one load-balanced group.
router_settings:
  num_retries: 3
  routing_strategy: simple-shuffle   # simple-shuffle | round-robin | least-busy | latency-based-routing
  timeout: 60                        # seconds, per attempt
  allowed_fails: 1                   # failures before a deployment is cooled down
  cooldown_time: 5                   # seconds
  fallbacks:
    - gpt-4o: [claude-sonnet]        # try claude-sonnet if the gpt-4o group fails
  # retry_policy:                    # optional per-error retry overrides
  #   RateLimitErrorRetries: 5
  #   BadRequestErrorRetries: 0

# Optional custom model prices (USD per token), overriding the built-in table.
# Used to compute response cost and tracked spend (GET /spend).
model_cost:
  gpt-4o:
    input_cost_per_token: 0.0000025
    output_cost_per_token: 0.00001

model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      weight: 1                      # optional load-balancing weight

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: qwen3.7-plus
    litellm_params:
      model: dashscope/qwen3.7-plus
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY